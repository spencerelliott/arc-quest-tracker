<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arc Quest Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Arc Quest Planner</h1>
      <p class="subtitle">Active quests grouped by map</p>
    </div>
    <div class="actions">
      <button type="button" id="expand-all" class="btn ghost" title="Expand all">Expand all</button>
      <button type="button" id="collapse-all" class="btn ghost" title="Collapse all">Collapse all</button>
      <button type="button" id="refresh" class="btn" title="Reload quest data">Refresh</button>
      <button type="button" id="open-settings" class="btn icon" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="summary" class="summary" hidden></section>
    <section id="maps"></section>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Settings</h2>
      <p class="hint">Your user key is stored only in this browser (localStorage) and is sent only to arctracker.io. Create one in ArcTracker → Settings → Developer Access with the <code>quests:read</code> scope.</p>

      <label for="user-key">User key <span class="muted">(<code>arc_u1_…</code>)</span></label>
      <input id="user-key" name="userKey" type="password" autocomplete="off" spellcheck="false" placeholder="arc_u1_…">

      <label class="check"><input type="checkbox" id="show-keys"> Show key</label>

      <fieldset>
        <legend>Display</legend>
        <label class="check"><input type="checkbox" id="show-locked" name="showLocked"> Include locked quests (prerequisites not done)</label>
        <label class="check"><input type="checkbox" id="show-anymap" name="showAnyMap"> Show quests with no specific map</label>
      </fieldset>

      <details class="debug">
        <summary>Debug: last API response</summary>
        <pre id="debug-output">Nothing fetched yet.</pre>
      </details>

      <div class="dialog-actions">
        <button type="button" id="clear-keys" class="btn danger ghost">Clear key</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-settings" class="btn ghost">Cancel</button>
        <button type="submit" id="save-settings" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
